name: Web checks
on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-checks.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-checks.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
