name: Diagnose Studyweb D1 authentication (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only authentication schema checks
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-audit --no-fund
          npx wrangler d1 execute exam_core --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','roles','user_roles','sessions','login_rate_limits') ORDER BY name"
          npx wrangler d1 execute exam_core --remote --command "SELECT 'users' AS table_name, COUNT(*) AS row_count FROM users UNION ALL SELECT 'roles',COUNT(*) FROM roles UNION ALL SELECT 'sessions',COUNT(*) FROM sessions UNION ALL SELECT 'login_rate_limits',COUNT(*) FROM login_rate_limits"
          npx wrangler d1 execute exam_core --remote --command "SELECT code FROM roles ORDER BY code"
          # Aggregate checks only: never select emails, password hashes, tokens, or session IDs.
          npx wrangler d1 execute exam_core --remote --command "SELECT COUNT(*) AS active_users, SUM(CASE WHEN password_hash LIKE 'pbkdf2$%$%$%' AND LENGTH(password_hash)=115 THEN 0 ELSE 1 END) AS malformed_hashes FROM users WHERE status='active'"
          npx wrangler d1 execute exam_core --remote --command "SELECT name, type, \"notnull\" FROM pragma_table_info('sessions') WHERE name IN ('id','user_id','token_hash','expires_at','revoked_at') ORDER BY name"
          npx wrangler d1 execute exam_core --remote --command "SELECT name, type, \"notnull\" FROM pragma_table_info('login_rate_limits') WHERE name IN ('bucket_key','window_start','attempts','updated_at') ORDER BY name"
