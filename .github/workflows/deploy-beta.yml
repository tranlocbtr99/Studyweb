name: Deploy Studyweb beta (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_STUDYWEB_BETA to publish'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: studyweb-beta-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_STUDYWEB_BETA' }}
    runs-on: ubuntu-latest
    environment: beta-deployment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify backend
        working-directory: apps/api
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Check Worker package
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../.worker-preview
      - name: Deploy Worker and static assets
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee ../../worker-deploy.log
      - name: Post-deploy HTTPS smoke test
        env:
          STUDYWEB_DEPLOY_URL: ${{ vars.STUDYWEB_DEPLOY_URL }}
        run: node scripts/smoke-from-deploy.mjs
