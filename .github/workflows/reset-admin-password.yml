name: Reset existing Studyweb administrator password (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter RESET_EXISTING_ADMIN_PASSWORD'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: studyweb-admin-provision
  cancel-in-progress: false
jobs:
  reset-admin-password:
    if: ${{ inputs.confirmation == 'RESET_EXISTING_ADMIN_PASSWORD' }}
    runs-on: ubuntu-latest
    environment: production-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset only the existing administrator password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STUDYWEB_ADMIN_EMAIL: ${{ secrets.STUDYWEB_ADMIN_EMAIL }}
          STUDYWEB_ADMIN_PASSWORD: ${{ secrets.STUDYWEB_ADMIN_PASSWORD }}
        run: node scripts/reset-admin-password.mjs
