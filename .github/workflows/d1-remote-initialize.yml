name: Initialize Cloudflare D1 (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type INITIALIZE_EMPTY_D1 to confirm both databases are empty'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: studyweb-d1-initialization
  cancel-in-progress: false
jobs:
  initialize:
    if: ${{ inputs.confirmation == 'INITIALIZE_EMPTY_D1' }}
    runs-on: ubuntu-latest
    environment: beta-database
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Verify both databases are empty before changes
        shell: bash
        run: |
          set -euo pipefail
          for database in exam_core exam_results; do
            echo "Checking empty database: $database"
            if ! output=$(npx wrangler d1 execute "$database" --remote --json --command="SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" 2>&1); then
              echo "Cloudflare query failed for $database (check token permissions, account ID, and database binding):"
              echo "$output" | sed -E 's/(cfut_[A-Za-z0-9_-]+)/[REDACTED]/g'
              exit 1
            fi
            echo "$output" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const data=JSON.parse(s);
                const rows=Array.isArray(data)?data[0]?.results:data?.results;
                if(!Array.isArray(rows)||rows.length!==1||Number(rows[0].n)!==0){
                  console.error("Database is not empty or response cannot be verified; stopping.");
                  process.exit(1);
                }
              });'
          done
      - name: Apply core migrations in order
        run: |
          set -euo pipefail
          for file in ../../packages/db/migrations/core/000{1,2,3,4,5}_*.sql; do
            test -f "$file"
            npx wrangler d1 execute exam_core --remote --file="$file"
          done
      - name: Apply results baseline
        run: npx wrangler d1 execute exam_results --remote --file=../../packages/db/migrations/results/0001_initial.sql
      - name: Verify core schema
        run: npx wrangler d1 execute exam_core --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
      - name: Verify results schema
        run: npx wrangler d1 execute exam_results --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
