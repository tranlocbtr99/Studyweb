name: Verify PBKDF2 in local Workers runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated local Worker
        working-directory: apps/api
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx wrangler dev ../../scripts/worker-pbkdf2-probe.mjs --local --port 8791 --ip 127.0.0.1 > /tmp/pbkdf2-probe.log 2>&1 &
          echo $! > /tmp/pbkdf2-probe.pid
      - name: Run synthetic PBKDF2 test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          let response;
          for (let attempt = 0; attempt < 30; attempt++) {
            try { response = await fetch('http://127.0.0.1:8791/probe', { signal: AbortSignal.timeout(10000) }); break; }
            catch { await new Promise(resolve => setTimeout(resolve, 1000)); }
          }
          if (!response) throw new Error('Local Worker did not start');
          const result = await response.json();
          console.log(JSON.stringify({ status: response.status, ...result }));
          if (!response.ok || !result.passed) process.exitCode = 1;
          NODE
      - name: Stop isolated Worker
        if: always()
        run: kill "$(cat /tmp/pbkdf2-probe.pid)" 2>/dev/null || true
