name: Publish authorized LTStudy community release
on:
  push:
    branches: [main]
    paths: ['.github/releases/ltstudy-20261025.json']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_LTSTUDY_20261025'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: studyweb-beta-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' || inputs.confirmation == 'PUBLISH_LTSTUDY_20261025'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: beta-deployment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      STUDYWEB_RELEASE_URL: https://studyweb-api.tranlocbtr99.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate this authorized release and credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';
          const path='.github/releases/ltstudy-20261025.json';
          const marker=JSON.parse(readFileSync(path,'utf8'));
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim();
          if(marker.authorization!=='PUBLISH_LTSTUDY_20261025'||marker.sourceCommit!==parent||changed!==path)throw Error('The release commit must contain only its approved marker and point to the verified source');
          JS
      - name: Stamp and build exact frontend release
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const sha=process.env.GITHUB_SHA;if(!/^[a-f0-9]{40}$/.test(sha??''))throw Error('Missing SHA');
          writeFileSync('index.html',readFileSync('index.html','utf8').replace('</head>','<meta name="ltstudy-release" content="'+sha+'"/></head>'));
          JS
          npm run typecheck
          npm run build
      - name: Verify API and nonempty database upgrade safety
        working-directory: apps/api
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          node --test ../../scripts/migrate-release.test.mjs
          npx wrangler deploy --dry-run --outdir ../../.worker-preview
      - name: Capture recovery bookmarks and previous Worker version
        working-directory: apps/api
        run: |
          npx wrangler d1 time-travel info exam_core --json > ../../before-core-bookmark.json
          npx wrangler d1 time-travel info exam_results --json > ../../before-results-bookmark.json
          npx wrangler deployments list --json > ../../before-worker.json
      - name: Upgrade existing D1 schemas without reinitialization
        run: node scripts/migrate-release.mjs
      - name: Publish Worker and frontend
        id: publish
        working-directory: apps/api
        run: npx wrangler deploy --var RELEASE_SHA:"$GITHUB_SHA"
      - name: Verify exact live version and authenticated boundaries
        run: node scripts/verify-live-release.mjs
      - name: Roll back Worker if live verification failed
        if: failure() && steps.publish.outcome == 'success'
        run: node scripts/rollback-release.mjs
      - name: Retain recovery metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltstudy-release-recovery-metadata
          path: |
            before-core-bookmark.json
            before-results-bookmark.json
            before-worker.json
          if-no-files-found: ignore
          retention-days: 7
