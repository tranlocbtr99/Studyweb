name: D1 local migration checks
on:
  push:
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/tests/d1-*.sql'
      - 'apps/api/wrangler.jsonc'
      - '.github/workflows/d1-local-checks.yml'
  pull_request:
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/tests/d1-*.sql'
      - 'apps/api/wrangler.jsonc'
      - '.github/workflows/d1-local-checks.yml'
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply core baseline
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/migrations/core/0001_initial.sql
      - name: Apply login rate limit migration
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/migrations/core/0002_login_rate_limits.sql
      - name: Apply admin audit migration
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/migrations/core/0003_admin_audit.sql
      - name: Apply question drafts migration
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/migrations/core/0004_question_drafts.sql
      - name: Apply results baseline
        run: npx wrangler d1 execute exam_results --local --file=../../packages/db/migrations/results/0001_initial.sql
      - name: Verify core schema and integrity
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/tests/d1-core-check.sql
      - name: Verify admin writes and duplicate slug
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/tests/d1-admin-check.sql
      - name: Verify question drafts and option constraints
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/tests/d1-question-check.sql
      - name: Verify version allocation and immutability
        run: npx wrangler d1 execute exam_core --local --file=../../packages/db/tests/d1-version-check.sql
      - name: Verify published versions reject modification
        shell: bash
        run: |
          set +e
          output=$(npx wrangler d1 execute exam_core --local --file=../../packages/db/tests/d1-version-reject.sql 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: Published version was modified"
            exit 1
          fi
          if ! grep -q "published version immutable" <<< "$output"; then
            echo "$output"
            echo "ERROR: Unexpected database error"
            exit 1
          fi
          echo "Published version modification correctly rejected"
      - name: Verify results schema and integrity
        run: npx wrangler d1 execute exam_results --local --file=../../packages/db/tests/d1-results-check.sql
