name: Diagnose live Studyweb authentication logs (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parser against safe synthetic fixtures
        run: node scripts/test-filter-worker-auth-logs.mjs
      - name: Capture only allowlisted authentication error categories for 2 minutes
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-audit --no-fund
          set +e
          timeout 120s npx wrangler tail studyweb-api --format json 2> /tmp/studyweb-tail-status.log | node ../../scripts/filter-worker-auth-logs.mjs
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            echo "Worker tail failed; check Cloudflare token permission for tail access (exit $result)"
            exit "$result"
          fi
          echo "Capture window complete; no credentials, URLs or IP addresses were printed"
